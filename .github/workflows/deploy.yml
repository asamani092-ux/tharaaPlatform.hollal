name: Deploy Frontend to Hostinger

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: 🎉 Deploy
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v3

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: 🛠️ Install pnpm
        uses: pnpm/action-setup@v4

      - name: 📥 Install All Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: 🏗️ Build Frontend
        env:
          PORT: 3000
          BASE_PATH: /
          NODE_ENV: production
          CI: false
        run: pnpm --filter "./artifacts/tharaa" build

      - name: 🚀 Sync files to Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # أخذ الملفات من داخل المجلد الذي حدده Vite في outDir
          local-dir: ./artifacts/tharaa/dist/public/
          # تحديد المسار الصحيح للموقع في هوستنجر
          server-dir: ./
          dangerous-clean-slate: false
          exclude: |
            **/api/**
            .htaccess

      - name: 📁 Stage analytics.php for API upload
        run: |
          mkdir -p .deploy-api
          cp hostinger-php/api/analytics.php .deploy-api/analytics.php

      - name: 🚀 Sync analytics.php to Hostinger API
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./.deploy-api/
          server-dir: ./api/
          dangerous-clean-slate: false
